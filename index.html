<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="BeatEmPie — a 2D web arcade beat 'em up where Shushki fights waves of fish and whales by dropping magical pies from the sky."
    />
    <title>BeatEmPie 🥧</title>
    <style>
      :root {
        color-scheme: dark;
        --app-width: 100vw;
        /* dvh tracks the URL-bar-adjusted mobile viewport; vh is the static fallback. */
        --app-height: 100vh;
        --app-height: 100dvh;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        /* inset:0 pins the shell to the whole window so the navy background always covers the
           full viewport - no uncovered strip (the mobile "grey bar") can ever show through. */
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d2b;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d2b;
      }
      #game-root:fullscreen,
      #game-root:-webkit-full-screen {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* NONE-scale canvas stretched edge-to-edge over the navy shell (full-bleed, like desktop).
         The vars default to the full viewport and are kept pixel-exact by the orientation gate. */
      #game-root canvas {
        display: block;
        width: var(--app-width) !important;
        height: var(--app-height) !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* The game draws its own cursor (see ui/GameCursor); hide the OS pointer so
           players never see two cursors. !important beats Phaser's inline hand-cursor. */
        cursor: none !important;
      }
      #boot-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffe08a;
        font-size: 1.5rem;
        letter-spacing: 0.1em;
        pointer-events: none;
        z-index: 10;
      }
      #fullscreen-btn {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 18px);
        right: calc(env(safe-area-inset-right, 0px) + 18px);
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 50%;
        background: rgba(11, 13, 43, 0.42);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        z-index: 9000;
        transition: transform 160ms ease, background 160ms ease;
      }
      #fullscreen-btn:hover {
        background: rgba(58, 43, 107, 0.62);
        transform: scale(1.06);
      }
      #fullscreen-btn:active {
        transform: scale(0.96);
      }
      #fullscreen-btn .fs-corner {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: #ffe08a;
        border-style: solid;
        transition: transform 180ms ease;
      }
      #fullscreen-btn .tl {
        top: 14px;
        left: 14px;
        border-width: 3px 0 0 3px;
      }
      #fullscreen-btn .tr {
        top: 14px;
        right: 14px;
        border-width: 3px 3px 0 0;
      }
      #fullscreen-btn .bl {
        bottom: 14px;
        left: 14px;
        border-width: 0 0 3px 3px;
      }
      #fullscreen-btn .br {
        right: 14px;
        bottom: 14px;
        border-width: 0 3px 3px 0;
      }
      #fullscreen-btn[data-active='true'] .tl {
        transform: translate(5px, 5px);
      }
      #fullscreen-btn[data-active='true'] .tr {
        transform: translate(-5px, 5px);
      }
      #fullscreen-btn[data-active='true'] .bl {
        transform: translate(5px, -5px);
      }
      #fullscreen-btn[data-active='true'] .br {
        transform: translate(-5px, -5px);
      }

      /* Full-viewport "rotate your device" overlay. Pure CSS/DOM (not drawn inside the
         Phaser canvas) so it is always crisp and full-size regardless of canvas letterboxing.
         Visibility is driven entirely by the media query below; orientation.ts only reads
         the same conditions to coordinate pausing gameplay/audio, it never toggles this. */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9500;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vh;
        background: #0b0d2b;
        color: #ffe08a;
        text-align: center;
        padding: 8vw;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
      #rotate-overlay .phone {
        width: 34vw;
        max-width: 220px;
        aspect-ratio: 10 / 19;
        border: 0.9vw solid #ffe08a;
        border-radius: 5vw;
        background: rgba(255, 224, 138, 0.08);
        position: relative;
        animation: bep-rotate 2.6s ease-in-out infinite;
      }
      #rotate-overlay .phone::before {
        content: '';
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        width: 24%;
        height: 2.4%;
        border-radius: 2vw;
        background: #ffe08a;
        opacity: 0.85;
      }
      #rotate-overlay .arrow-svg {
        width: 20vw;
        max-width: 96px;
        height: auto;
      }
      #rotate-overlay h2 {
        font-size: 7vw;
        margin: 0;
        font-weight: bold;
      }
      #rotate-overlay p {
        font-size: 4vw;
        margin: 0;
        color: #fff4d6;
        opacity: 0.8;
      }
      @keyframes bep-rotate {
        0%,
        30% {
          transform: rotate(0deg);
        }
        55%,
        80% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="boot-loader">Heating the ovens… 🥧</div>
    </div>
    <button id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
      <span class="fs-corner tl" aria-hidden="true"></span>
      <span class="fs-corner tr" aria-hidden="true"></span>
      <span class="fs-corner bl" aria-hidden="true"></span>
      <span class="fs-corner br" aria-hidden="true"></span>
    </button>
    <div id="rotate-overlay" aria-hidden="true">
      <!--
        Curved rotate arrow: the stroke progressively draws from the right
        end to the left (stroke-dashoffset 100->0), then un-draws back
        (0->100), on a loop. The arrowhead rides the SAME path via
        animateMotion with matching keyTimes, so it always sits exactly on
        the curve, tangent to it (rotate="auto"), and always leads the
        reveal — no separate/guessed coordinates that can drift out of
        alignment with the curve.
      -->
      <svg class="arrow-svg" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
        <path
          id="bep-arrow-path"
          d="M 82 41 A 40 40 0 0 0 22 41"
          fill="none"
          pathLength="100"
          stroke="#ffe08a"
          stroke-width="7"
          stroke-linecap="round"
          stroke-dasharray="100"
          stroke-dashoffset="100"
        >
          <animate attributeName="stroke-dashoffset" values="100;0;100" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite" />
        </path>
        <polygon points="-7,-5 7,0 -7,5" fill="#ffe08a">
          <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
            <mpath href="#bep-arrow-path" xlink:href="#bep-arrow-path"></mpath>
          </animateMotion>
        </polygon>
      </svg>
      <div class="phone"></div>
      <h2>Rotate your device</h2>
      <p>BeatEmPie plays best in landscape 🥧</p>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
