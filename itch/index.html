<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shushki's Pie Brigade</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #ff8a3d 0%, #ffb347 45%, #ffe066 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
    color: #4a2600;
  }
  #welcome h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin: 0 0 0.25em;
    text-shadow: 2px 2px 0 #fff3c4, 4px 4px 0 rgba(0,0,0,0.15);
  }
  #welcome p {
    font-size: 1.1rem;
    margin: 0 0 1.5em;
    opacity: 0.85;
  }
  #playBtn {
    font-size: 1.4rem;
    font-weight: bold;
    padding: 0.75em 2em;
    border: none;
    border-radius: 999px;
    background: #ff4d4d;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #b32d2d, 0 8px 12px rgba(0,0,0,0.3);
    transition: transform 0.1s ease;
  }
  #playBtn:hover { transform: translateY(-2px); }
  #playBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b32d2d, 0 4px 8px rgba(0,0,0,0.3);
  }
  #gameFrame {
    display: none;
    width: 100%;
    height: 100%;
    border: none;
  }
  #errorMsg {
    margin-top: 1em;
    color: #7a1f1f;
    font-size: 0.9rem;
    display: none;
  }
</style>
</head>
<body>
  <div id="welcome">
    <h1>🥧 Shushki's Pie Brigade</h1>
    <p>Sky-drop pies. Smash fish and whales. Take down Captain Leviathan.</p>
    <button id="playBtn">Click to PLAY</button>
    <div id="errorMsg">Fullscreen unavailable — launching in windowed mode.</div>
  </div>
  <iframe id="gameFrame" allow="fullscreen; autoplay" allowfullscreen></iframe>

  <script>
    var LIVE_URL = 'https://beat-em-pie.vercel.app/?embed=1';

    document.getElementById('playBtn').addEventListener('click', function () {
      var launch = function () {
        var welcome = document.getElementById('welcome');
        var frame = document.getElementById('gameFrame');
        frame.src = LIVE_URL;
        welcome.style.display = 'none';
        frame.style.display = 'block';
      };

      var el = document.documentElement;
      var requestFs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;

      if (requestFs) {
        Promise.resolve(requestFs.call(el)).then(launch).catch(function () {
          document.getElementById('errorMsg').style.display = 'block';
          launch();
        });
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        launch();
      }
    });
  </script>
</body>
</html>
